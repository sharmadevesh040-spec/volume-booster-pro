name: Build and Release Volume Booster Pro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\VolumeBoosterPro\* -DestinationPath dist\VolumeBoosterPro-Windows-Portable.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/VolumeBoosterPro-Setup.exe
            dist/VolumeBoosterPro-Windows-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true

